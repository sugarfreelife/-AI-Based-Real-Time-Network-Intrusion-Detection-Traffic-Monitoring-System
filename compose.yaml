name: nids-local

x-database-url: &database-url "postgresql+psycopg://${POSTGRES_USER:-nids}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-nids}"

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nids}
      POSTGRES_USER: ${POSTGRES_USER:-nids}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: *database-url
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ISSUER: ${JWT_ISSUER:-nids-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-nids-client}
      MODEL_PATH: ${MODEL_PATH:-}
      CORS_ORIGINS: http://localhost:${DASHBOARD_PORT:-8080},http://127.0.0.1:${DASHBOARD_PORT:-8080}
      NIDS_LOG_LEVEL: ${NIDS_LOG_LEVEL:-INFO}
    volumes:
      - ./ml/models:/models:ro
    command:
      - sh
      - -c
      - python -m alembic upgrade head && exec python -m backend.app.cli --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  monitor:
    profiles: [demo]
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/nids-monitor-container"]
    environment:
      DATABASE_URL: *database-url
      PCAP_PATH: ${PCAP_PATH:-/captures/demo.pcap}
      CAPTURE_ID: ${CAPTURE_ID:-}
      MODEL_PATH: ${MODEL_PATH:-}
    volumes:
      - ./pcaps:/captures:ro
      - ./ml/models:/models:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
